# Reuse the caller's X-Request-ID when it looks sane, else nginx's own
# $request_id, and pass it upstream so nginx + backend lines share one id.
map $http_x_request_id $req_id {
    default                  $request_id;
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
}

# One JSON object per line on stdout (the official image symlinks
# access.log to /dev/stdout). No query string, cookies or auth headers.
log_format json_access escape=json
    '{"timestamp":"$time_iso8601","level":"info","message":"http_request",'
    '"service":"nginx","request_id":"$req_id","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"latency_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"client_ip":"$remote_addr","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json_access;

    root /usr/share/nginx/html;
    index index.html;

    # Generated audio can be large-ish; don't buffer/time out aggressively.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 300s;
    }

    location / {
        # Static assets: no access log noise.
        access_log off;
        try_files $uri /index.html;
    }
}
